name: Aplicar migraciones de Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: qsdnmdyprzrvgcwpvoba
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pineado: "latest" bajó una versión con un bug de validación de
          # schema en `link` (SchemaError en el campo inserted_at de las API
          # keys). 2.111.0 es la que se probó en local sin problemas.
          version: 2.111.0

      - name: Link al proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Migraciones pendientes
        run: supabase migration list --linked

      - name: Aplicar
        run: supabase db push --linked
