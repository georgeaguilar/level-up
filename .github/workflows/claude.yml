name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Decides the branch strategy for issue triggers: reuse issue/{N} if it
      # already exists on origin, otherwise let the action create it fresh.
      # PR-triggered runs (comment/review on a PR) are left alone — the action's
      # default "push to the existing PR branch" behavior already does the right thing.
      - name: Determine target branch
        id: target
        env:
          IS_PR: ${{ (github.event.issue.pull_request != null) || (github.event.pull_request != null) }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [[ "$IS_PR" == "true" || -z "$ISSUE_NUMBER" ]]; then
            {
              echo 'instructions<<EOF'
              echo '- You are on a pull request branch. Push directly to it as usual, do not create a new branch.'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="issue/${ISSUE_NUMBER}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            MSG="- Branch \`$BRANCH\` already exists on origin. Before editing anything, run: \`git fetch origin $BRANCH\` then \`git checkout $BRANCH\`. Do not create a new branch. Commit and push only to \`$BRANCH\`."
          else
            MSG="- You are already on branch \`$BRANCH\` (created for this issue). Stay on it; do not create another branch."
          fi
          {
            echo 'instructions<<EOF'
            echo "$MSG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # New issue-triggered runs create issue/{number} instead of claude/issue-{number}-{timestamp}.
          # Note: if issue/{number} already exists, the action itself falls back to a
          # claude/issue-{number}-{timestamp} branch it never pushes — the actual push target
          # (issue/{number}, reused) comes from the `prompt` instructions below, not from this input.
          branch_prefix: 'issue/'
          branch_name_template: '{{prefix}}{{entityNumber}}'
          # Required so track_progress-forced tag mode still keeps the progress comment on plain issue events.
          track_progress: true

          # Branch reuse and commit conventions, appended to the action's default instructions.
          prompt: |
            Branch handling for this task (overrides the default branch instructions above):
            ${{ steps.target.outputs.instructions }}

            Commit message rules (always follow these; they override any default commit message format):
            - Use Conventional Commits: `<type>: <short imperative summary>` (feat, fix, refactor, chore, docs, style, test).
            - One-line summary only, no body unless strictly necessary.
            - Never add a "Co-authored-by" trailer or any other attribution line.

          # Extra Bash tools needed to check out an existing branch (base tag-mode tools only cover add/commit/rm/push).
          claude_args: '--allowedTools "Bash(git fetch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*)"'

